[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-service"
version = "0.1.0"
description = "Customer service application foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic-settings>=2,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<1",
  "alembic>=1.13,<2",
  "redis>=5.2,<7",
  "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "langgraph>=1,<2",
]

[project.optional-dependencies]
agent = []
manual = ["torch>=2", "transformers>=4.40,<5"]
retrieval = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "joblib>=1.3,<2"]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[tool.setuptools.packages.find]
include = ["agent*", "rag*", "backend*", "scripts*"]

[tool.setuptools.package-data]
agent = ["prompts/*.md"]
