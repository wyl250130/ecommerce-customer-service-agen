services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CS_POSTGRES_USER:?Set CS_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${CS_POSTGRES_PASSWORD:?Set CS_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${CS_POSTGRES_DB:?Set CS_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${CS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${CS_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 192m

volumes:
  postgres_data:
